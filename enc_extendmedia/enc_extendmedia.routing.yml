enc_extendmedia.media_id_by_uuid:
  path: '/enc-media/media/{uuid}/get-id'
  defaults:
    _controller: '\Drupal\enc_extendmedia\Controller\MediaGetIdController::getId'
  requirements:
    _permission: 'update any media'
    uuid: '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'
