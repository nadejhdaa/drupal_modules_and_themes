services:
  client_base:
    class: Drupal\med_mis\Client\ClientBase
    arguments: [
      '@config.factory',
      '@http_client',
      '@session',
      '@messenger',
      '@database',
      '@current_user',
      '@med_lk.user_service.qqc153',
      '@request_stack',
    ]

  mis_client:
    class: Drupal\med_mis\Client\MisClient
    arguments: [
      '@session',
      '@current_user',
      '@client_base',
      '@messenger',
    ]

  mis_data:
    class: Drupal\med_mis\MisData
    arguments: [
      '@entity_type.manager',
      '@current_user',
      '@cache.default',
      '@date.formatter',
      '@messenger',
      '@renderer',
      '@mis_client',
      '@session',
    ]
